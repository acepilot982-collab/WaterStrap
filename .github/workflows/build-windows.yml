
name: Build Waterstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-waterstrap.yml"

permissions:
  contents: write

concurrency:
  group: waterstrap-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Waterstrap for Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bloxstrap source and submodules
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/bloxstraplabs/bloxstrap.git upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Bloxstrap."
          }

          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize submodules."
          }

          "UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rename application identity
        shell: pwsh
        run: |
          $file = "upstream/Bloxstrap/App.xaml.cs"
          $source = Get-Content $file -Raw

          $source = $source -replace `
            'ProjectName = "Bloxstrap";',
            'ProjectName = "Waterstrap";'

          $source = $source -replace `
            'ProjectOwner = "Bloxstrap";',
            'ProjectOwner = "Waterstrap";'

          $source = $source -replace `
            'ProjectRepository = "bloxstraplabs/bloxstrap";',
            'ProjectRepository = "acepilot982-collab/NovaStraps";'

          $source = $source -replace `
            'ProjectDownloadLink = "https://bloxstraplabs\.com";',
            'ProjectDownloadLink = "https://github.com/acepilot982-collab/NovaStraps/releases"'

          Set-Content $file $source -Encoding utf8

          if (-not (Select-String $file -Pattern 'ProjectName = "Waterstrap"' -Quiet)) {
            throw "Failed to update the application name."
          }

      - name: Replace visible UI branding
        shell: pwsh
        run: |
          $root = "upstream/Bloxstrap"

          # Update displayed text in resource files.
          Get-ChildItem $root -Recurse -File -Filter "*.resx" |
            ForEach-Object {
              $file = $_.FullName
              $content = Get-Content $file -Raw

              $content = [regex]::Replace(
                $content,
                '(?<=<value>)[^<]*Bloxstrap[^<]*(?=</value>)',
                { param($m) $m.Value -replace '(?i)Bloxstrap', 'Waterstrap' }
              )

              Set-Content $file $content -Encoding utf8
            }

          # Update user-visible XAML attributes and literal text.
          Get-ChildItem $root -Recurse -File -Filter "*.xaml" |
            ForEach-Object {
              $file = $_.FullName
              $content = Get-Content $file -Raw

              $content = [regex]::Replace(
                $content,
                '(?i)(\b(?:Title|Text|Content|Header|ToolTip|Label|Description|PlaceholderText)\s*=\s*["''][^"'']*)Bloxstrap([^"'']*["''])',
                { param($m) $m.Groups[1].Value + 'Waterstrap' + $m.Groups[2].Value }
              )

              # Replace standalone visible text, not XML namespaces or type names.
              $content = [regex]::Replace(
                $content,
                '(?i)(<(?:TextBlock|Run|Label|Button|MenuItem|Hyperlink)\b[^>]*>)(\s*)Bloxstrap(\s*)(</(?:TextBlock|Run|Label|Button|MenuItem|Hyperlink)>)',
                '$1$2Waterstrap$3$4'
              )

              Set-Content $file $content -Encoding utf8
            }

          # Replace branding inside ordinary C# string literals.
          # URLs are excluded so links and namespaces are not accidentally changed.
          Get-ChildItem $root -Recurse -File -Filter "*.cs" |
            ForEach-Object {
              $file = $_.FullName
              $content = Get-Content $file -Raw

              $content = [regex]::Replace(
                $content,
                '(["''])([^"''\r\n]*Bloxstrap[^"''\r\n]*)(["''])',
                {
                  param($m)
                  $value = $m.Groups[2].Value

                  if ($value -match '(?i)https?://|bloxstraplabs\.com') {
                    return $m.Value
                  }

                  return $m.Groups[1].Value +
                    ($value -replace '(?i)Bloxstrap', 'Waterstrap') +
                    $m.Groups[3].Value
                }
              )

              Set-Content $file $content -Encoding utf8
            }

          Write-Host "Visible branding replacement completed."

      - name: Set executable assembly name
        shell: pwsh
        run: |
          $file = "upstream/Bloxstrap/Bloxstrap.csproj"
          [xml]$project = Get-Content $file -Raw

          $ns = New-Object System.Xml.XmlNamespaceManager($project.NameTable)
          $ns.AddNamespace("msb", "http://schemas.microsoft.com/developer/msbuild/2003")

          $assembly = $project.SelectSingleNode(
            "//*[local-name()='AssemblyName']"
          )

          if ($null -eq $assembly) {
            $group = $project.SelectSingleNode(
              "/*[local-name()='Project']/*[local-name()='PropertyGroup']"
            )

            if ($null -eq $group) {
              throw "Could not find the project property group."
            }

            $assembly = $project.CreateElement("AssemblyName")
            [void]$group.AppendChild($assembly)
          }

          $assembly.InnerText = "Waterstrap"
          $project.Save((Resolve-Path $file).Path)

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore upstream/Bloxstrap/Bloxstrap.csproj `
            --runtime win-x64 `
            -p:EnableWindowsTargeting=true

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency restore failed."
          }

      - name: Publish Waterstrap
        shell: pwsh
        run: |
          dotnet publish upstream/Bloxstrap/Bloxstrap.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableWindowsTargeting=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output published/Waterstrap

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed. Check the build log."
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "published/Waterstrap/Waterstrap.exe"

          if (-not (Test-Path $exe)) {
            Get-ChildItem published/Waterstrap -Recurse |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "Waterstrap.exe was not produced."
          }

          $file = Get-Item $exe

          if ($file.Length -lt 1000000) {
            throw "Executable is unexpectedly small."
          }

          Write-Host "Created $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload Waterstrap executable
        uses: actions/upload-artifact@v4
        with:
          name: Waterstrap-Windows-x64
          path: published/Waterstrap/Waterstrap.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waterstrap-build-${{ github.run_number }}
          name: Waterstrap Build ${{ github.run_number }}
          body: |
            Unofficial Waterstrap Windows x64 build based on Bloxstrap.
            Upstream commit: ${{ env.UPSTREAM_COMMIT }}

            This community build is not affiliated with Roblox or the original Bloxstrap maintainers.
            Original license and attribution notices must be retained.
          files: published/Waterstrap/Waterstrap.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
