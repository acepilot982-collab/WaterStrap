name: Build WaterStrap macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/macos-dmg"
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

concurrency:
  group: waterstrap-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.rid }} DMG
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    defaults:
      run:
        working-directory: macos

    steps:
      - name: Check out WaterStrap
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish WaterStrap for macOS
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish WaterStrap.Mac/WaterStrap.Mac.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            -p:UseAppHost=true \
            --output "$RUNNER_TEMP/publish/${{ matrix.rid }}"

      - name: Package app bundle and disk image
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          PUBLISH="$RUNNER_TEMP/publish/$RID"
          APP="$RUNNER_TEMP/WaterStrap.app"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG="$RUNNER_TEMP/WaterStrap-macOS-$RID.dmg"

          test -x "$PUBLISH/WaterStrap" || {
            echo "Expected WaterStrap app host was not produced." >&2
            ls -la "$PUBLISH" || true
            exit 1
          }

          rm -rf "$APP" "$DMG_ROOT" "$DMG"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$DMG_ROOT"
          cp -R "$PUBLISH/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/WaterStrap"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>WaterStrap</string>
            <key>CFBundleIdentifier</key><string>io.github.acepilot982collab.waterstrap</string>
            <key>CFBundleName</key><string>WaterStrap</string>
            <key>CFBundleDisplayName</key><string>WaterStrap</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          cp -R "$APP" "$DMG_ROOT/WaterStrap.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "WaterStrap" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG"
          test -s "$DMG"
          echo "Created $DMG"

      - name: Upload architecture-specific DMG
        uses: actions/upload-artifact@v4
        with:
          name: WaterStrap-macOS-${{ matrix.rid }}-DMG
          path: ${{ runner.temp }}/WaterStrap-macOS-${{ matrix.rid }}.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish downloadable DMGs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: WaterStrap-macOS-*-DMG
          path: release-assets
          merge-multiple: true

      - name: Create pre-release with DMG files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waterstrap-macos-${{ github.run_number }}
          name: WaterStrap macOS Preview ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            WaterStrap macOS Preview build.

            Includes separate disk images for Apple Silicon (osx-arm64) and Intel (osx-x64) Macs.
            This is an unsigned preview build. macOS may warn before opening it.
            This edition currently provides the launcher UI, Roblox website launch flow, and local recent-game list. It is not feature-equivalent to the Windows WPF bootstrapper yet.
            Not affiliated with Roblox Corporation or Bloxstrap maintainers.
          files: release-assets/*.dmg
