
name: Build Waterstrap

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-waterstrap.yml"

permissions:
  contents: write

concurrency:
  group: waterstrap-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Waterstrap for Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out Waterstrap repository
        uses: actions/checkout@v4

      - name: Download pinned Bloxstrap source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $upstreamCommit = "02db76006741f039b79ac7547b8054d7f3ccfc05"

          git clone https://github.com/bloxstraplabs/bloxstrap.git upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone the upstream source repository."
          }

          git -C upstream checkout --detach $upstreamCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check out the pinned upstream commit."
          }

          git -C upstream submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize the required WPF UI submodule."
          }

          $actualCommit = (git -C upstream rev-parse HEAD).Trim()
          "UPSTREAM_COMMIT=$actualCommit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building upstream commit $actualCommit"

      - name: Set Waterstrap application identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "upstream/Bloxstrap/App.xaml.cs"

          if (-not (Test-Path -LiteralPath $file)) {
            throw "App.xaml.cs was not found in the pinned source."
          }

          $source = Get-Content -LiteralPath $file -Raw

          $replacements = [ordered]@{
            'ProjectName = "Bloxstrap-QA";' = 'ProjectName = "Waterstrap-QA";'
            'ProjectName = "Bloxstrap";' = 'ProjectName = "Waterstrap";'
            'ProjectOwner = "Bloxstrap";' = 'ProjectOwner = "Waterstrap";'
            'ProjectRepository = "bloxstraplabs/bloxstrap";' = 'ProjectRepository = "acepilot982-collab/NovaStraps";'
            'ProjectDownloadLink = "https://bloxstraplabs.com";' = 'ProjectDownloadLink = "https://github.com/acepilot982-collab/NovaStraps/releases";'
            'ProjectHelpLink = "https://bloxstraplabs.com/wiki/help/";' = 'ProjectHelpLink = "https://github.com/acepilot982-collab/NovaStraps";'
            'ProjectSupportLink = "https://github.com/bloxstraplabs/bloxstrap/issues/new";' = 'ProjectSupportLink = "https://github.com/acepilot982-collab/NovaStraps/issues/new";'
          }

          foreach ($pair in $replacements.GetEnumerator()) {
            if (-not $source.Contains($pair.Key)) {
              throw "Expected source identity line was not found: $($pair.Key)"
            }

            $source = $source.Replace($pair.Key, $pair.Value)
          }

          Set-Content -LiteralPath $file -Value $source -Encoding utf8

          $check = Get-Content -LiteralPath $file -Raw

          $required = @(
            'ProjectName = "Waterstrap";',
            'ProjectRepository = "acepilot982-collab/NovaStraps";',
            'ProjectDownloadLink = "https://github.com/acepilot982-collab/NovaStraps/releases";'
          )

          foreach ($line in $required) {
            if (-not $check.Contains($line)) {
              throw "Application identity validation failed: $line"
            }
          }

      - name: Rename displayed resource values only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "upstream/Bloxstrap"
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter "*.resx")

          if ($files.Count -eq 0) {
            throw "No RESX resource files were found."
          }

          foreach ($file in $files) {
            $document = New-Object System.Xml.XmlDocument
            $document.PreserveWhitespace = $true
            $document.Load($file.FullName)

            # Change visible resource values only.
            # Resource keys, names and generated member identifiers stay unchanged.
            foreach ($entry in $document.SelectNodes("/root/data")) {
              if ($entry.HasAttribute("type") -or $entry.HasAttribute("mimetype")) {
                continue
              }

              $valueNode = $entry.SelectSingleNode("./value")

              if ($null -eq $valueNode) {
                continue
              }

              $valueText = $valueNode.InnerText
              $hasBrand = $valueText -match '(?i)Bloxstrap'
              $containsUrl = $valueText -match '(?i)https?://|bloxstraplabs\.com'

              if ($hasBrand -and -not $containsUrl) {
                $valueNode.InnerText = [regex]::Replace(
                  $valueText,
                  '(?i)Bloxstrap',
                  'Waterstrap'
                )
              }
            }

            $document.Save($file.FullName)
          }

          Write-Host "Updated displayed resource text without changing resource keys."

      - name: Rename literal XAML display text safely
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "upstream/Bloxstrap"
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter "*.xaml")

          $pattern = '(?i)(\b(?:Title|Text|Content|Header|ToolTip|Label|Description|PlaceholderText)\s*=\s*)(["''])(.*?)\2'

          foreach ($file in $files) {
            $content = Get-Content -LiteralPath $file.FullName -Raw

            $evaluator = [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)

              $value = $match.Groups[3].Value
              $hasBrand = $value -match '(?i)Bloxstrap'
              $hasMarkup = ($value.Contains('{') -or $value.Contains('}'))
              $looksLikeResource = $value -match '(?i)Strings\.|StaticResource|DynamicResource|\bBinding\b'

              # Preserve markup extensions and resource references exactly.
              if (-not $hasBrand -or $hasMarkup -or $looksLikeResource) {
                return $match.Value
              }

              return $match.Groups[1].Value +
                $match.Groups[2].Value +
                [regex]::Replace($value, '(?i)Bloxstrap', 'Waterstrap') +
                $match.Groups[2].Value
            }

            $content = [regex]::Replace($content, $pattern, $evaluator)

            Set-Content -LiteralPath $file.FullName -Value $content -Encoding utf8
          }

          Write-Host "Updated literal XAML text while preserving resource references."

      - name: Set executable name and preserve WPF namespaces
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = "upstream/Bloxstrap/Bloxstrap.csproj"

          if (-not (Test-Path -LiteralPath $file)) {
            throw "Bloxstrap.csproj was not found."
          }

          $projectText = Get-Content -LiteralPath $file -Raw
          $singleLine = [System.Text.RegularExpressions.RegexOptions]::Singleline

          $assemblyPattern = [regex]::new('<AssemblyName>.*?</AssemblyName>', $singleLine)

          if ($assemblyPattern.IsMatch($projectText)) {
            $projectText = $assemblyPattern.Replace(
              $projectText,
              '<AssemblyName>Waterstrap</AssemblyName>',
              1
            )
          }

          $rootPattern = [regex]::new('<RootNamespace>.*?</RootNamespace>', $singleLine)

          if ($rootPattern.IsMatch($projectText)) {
            $projectText = $rootPattern.Replace(
              $projectText,
              '<RootNamespace>Bloxstrap</RootNamespace>',
              1
            )
          }

          $missingProperties = @()

          if (-not $assemblyPattern.IsMatch($projectText)) {
            $missingProperties += '    <AssemblyName>Waterstrap</AssemblyName>'
          }

          if (-not $rootPattern.IsMatch($projectText)) {
            $missingProperties += '    <RootNamespace>Bloxstrap</RootNamespace>'
          }

          if ($missingProperties.Count -gt 0) {
            $groupPattern = [regex]::new('<PropertyGroup\b[^>]*>')
            $groupMatch = $groupPattern.Match($projectText)

            if (-not $groupMatch.Success) {
              throw "Could not find a PropertyGroup in Bloxstrap.csproj."
            }

            $insertion = $groupMatch.Value +
              [Environment]::NewLine +
              ($missingProperties -join [Environment]::NewLine)

            $projectText = $groupPattern.Replace($projectText, $insertion, 1)
          }

          Set-Content -LiteralPath $file -Value $projectText -Encoding utf8

          [xml]$projectCheck = Get-Content -LiteralPath $file -Raw

          $assemblyCheck = $projectCheck.SelectSingleNode(
            "//*[local-name()='AssemblyName']"
          )

          $rootCheck = $projectCheck.SelectSingleNode(
            "//*[local-name()='RootNamespace']"
          )

          if ($null -eq $assemblyCheck -or $assemblyCheck.InnerText -ne "Waterstrap") {
            throw "AssemblyName validation failed."
          }

          if ($null -eq $rootCheck -or $rootCheck.InnerText -ne "Bloxstrap") {
            throw "RootNamespace validation failed. WPF resource namespaces must stay Bloxstrap."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.428"

      - name: Restore dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore upstream/Bloxstrap/Bloxstrap.csproj `
            --runtime win-x64 `
            -p:EnableWindowsTargeting=true `
            -p:SelfContained=true

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency restore failed."
          }

      - name: Publish Waterstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish upstream/Bloxstrap/Bloxstrap.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableWindowsTargeting=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output published/Waterstrap

          if ($LASTEXITCODE -ne 0) {
            throw "Publish failed. Read the compiler error above this message."
          }

      - name: Verify the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "published/Waterstrap/Waterstrap.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "Publish directory contents:"

            Get-ChildItem -LiteralPath "published/Waterstrap" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            throw "Waterstrap.exe was not produced."
          }

          $file = Get-Item -LiteralPath $exe

          if ($file.Length -lt 1000000) {
            throw "Waterstrap.exe is unexpectedly small; check the publish output."
          }

          if (-not (Test-Path -LiteralPath "upstream/LICENSE")) {
            throw "The upstream license file is missing."
          }

          Write-Host "Build succeeded: $($file.FullName)"
          Write-Host "Executable size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waterstrap-Windows-x64
          path: published/Waterstrap/Waterstrap.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waterstrap-${{ github.run_number }}-${{ github.run_attempt }}
          name: Waterstrap Build ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          body: |
            Unofficial Waterstrap Windows x64 build based on Bloxstrap.
            Pinned upstream commit: ${{ env.UPSTREAM_COMMIT }}

            This community build is not affiliated with Roblox or the original Bloxstrap maintainers.
            The upstream license is included with this release.
          files: |
            published/Waterstrap/Waterstrap.exe
            upstream/LICENSE
          fail_on_unmatched_files: true
          generate_release_notes: false
